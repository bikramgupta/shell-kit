# OpenTelemetry Collector config for the Claude Code telemetry stack.
# Minimal, valid for otel/opentelemetry-collector-contrib.
#
# Claude Code exports OTLP (metrics + logs). We re-expose metrics on :8889 for
# Prometheus to scrape, and dump logs to stdout (view with `claude-telemetry logs`).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Metrics -> Prometheus scrape endpoint on :8889.
  # resource_to_telemetry_conversion promotes resource attributes (service.*,
  # host.*, and any OTEL_RESOURCE_ATTRIBUTES) to metric labels. Datapoint
  # attributes such as `model`, `type`, `decision`, `session_id` are already
  # emitted as labels.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # Logs -> stdout (detailed). Handy for eyeballing raw events during setup.
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
