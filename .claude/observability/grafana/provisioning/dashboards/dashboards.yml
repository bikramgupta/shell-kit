# Grafana dashboard provisioning.
# Loads every dashboard JSON from the mounted dashboards directory.

apiVersion: 1

providers:
  - name: claude-code
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
